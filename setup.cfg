[pycodestyle]
max-line-length = 120
# `ignore` replaces pycodestyle's default ignore list, so the defaults (E121,E123,E126,E226,E24,E704,W503,W504) are repeated here. E501 is added because docstrings and comments are written as one line per paragraph and left to the editor to wrap, as in the owner's other repositories.
ignore = E121,E123,E126,E226,E24,E704,W503,W504,E501
exclude = .git,__pycache__,archive,trash,deepti,repos
